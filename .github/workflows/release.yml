            **Dá»± Ã¡n / ãƒ—ãƒ­ã‚¸ã‚§ã‚¯ãƒˆ**: `${{ env.PROJECT_DIR }}`
            **NgÃ y táº¡o / ä½œæˆæ—¥æ™‚**: ${{ github.event.head_commit.timestamp || 'N/A' }}
            **NgÆ°á»i táº¡o / ä½œæˆè€…**: @${{ github.actor }}

            ---

            ### ðŸ‡»ðŸ‡³ ðŸ“¥ HÆ°á»›ng dáº«n
            1. Táº£i file **`.zip`** bÃªn dÆ°á»›i má»¥c **Assets**
               - Báº£n **`${{ env.PROJECT_DIR }}_${{ env.TAG_NAME }}.zip`**: Chá»©a toÃ n bá»™ source code sáº¡ch (báº£n Ä‘áº§y Ä‘á»§).
               - Báº£n **`${{ env.PROJECT_DIR }}_diff_data_${{ env.TAG_NAME }}.zip`** *(náº¿u cÃ³)*: Chá»‰ chá»©a cÃ¡c file Ä‘Ã£ Ä‘Æ°á»£c chá»‰nh sá»­a/thÃªm má»›i so vá»›i báº£n phÃ¡t hÃ nh trÆ°á»›c Ä‘Ã³.
            2. Giáº£i nÃ©n vÃ  bÃ n giao cho khÃ¡ch hÃ ng.

            > âš ï¸ **LÆ°u Ã½:** File ZIP chá»‰ chá»©a code Ä‘Ã£ build sáº¡ch (thÆ° má»¥c `${{ env.SOURCE_FOLDER }}/`), khÃ´ng chá»©a `node_modules` hay source code gá»‘c.


jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: ðŸ“¥ KÃ©o Source Code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: ðŸ” Äá»c cáº¥u hÃ¬nh Build
        id: config
        run: |
          BUILD_CMD=$(jq -r '.build_command // "npm run build"' deploy-config.json)
          SOURCE_FOLDER=$(jq -r '.source_folder | select(. != null and . != "") // "public"' deploy-config.json)

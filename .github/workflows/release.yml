            1. ä¸‹è¨˜ã® **Assets** ã‹ã‚‰ **`.zip`** ãƒ•ã‚¡ã‚¤ãƒ«ã‚’ãƒ€ã‚¦ãƒ³ãƒ­ãƒ¼ãƒ‰ã—ã¦ãã ã•ã„ã€‚
               - **`${{ env.PROJECT_DIR }}_${{ env.TAG_NAME }}.zip`**: å…¨ã¦ã®ã‚¯ãƒªãƒ¼ãƒ³ãªã‚½ãƒ¼ã‚¹ã‚³ãƒ¼ãƒ‰ãŒå«ã¾ã‚Œã¦ã„ã¾ã™ï¼ˆãƒ•ãƒ«ãƒãƒ¼ã‚¸ãƒ§ãƒ³ï¼‰ã€‚
               - **`${{ env.PROJECT_DIR }}_diff_data_${{ env.TAG_NAME }}.zip`** *(ã‚ã‚‹å ´åˆ)*: å‰å›žã®ãƒªãƒªãƒ¼ã‚¹ä»¥é™ã«ä¿®æ­£ãƒ»è¿½åŠ ã•ã‚ŒãŸãƒ•ã‚¡ã‚¤ãƒ«ã®ã¿ãŒå«ã¾ã‚Œã¦ã„ã¾ã™ï¼ˆå·®åˆ†ãƒ‡ãƒ¼ã‚¿ï¼‰ã€‚
            2. è§£å‡ã—ã¦ã€ãŠå®¢æ§˜ã«ç´å“ã—ã¦ãã ã•ã„ã€‚

            > âš ï¸ **æ³¨æ„:** ZIPãƒ•ã‚¡ã‚¤ãƒ«ã«ã¯ã€ãƒ“ãƒ«ãƒ‰æ¸ˆã¿ã®ã‚¯ãƒªãƒ¼ãƒ³ãªã‚³ãƒ¼ãƒ‰ï¼ˆ`${{ env.SOURCE_FOLDER }}/` ãƒ•ã‚©ãƒ«ãƒ€ï¼‰ã®ã¿ãŒå«ã¾ã‚Œã¦ãŠã‚Šã€`node_modules` ã‚„å…ƒã®ã‚½ãƒ¼ã‚¹ã‚³ãƒ¼ãƒ‰ã¯å«ã¾ã‚Œã¦ã„ã¾ã›ã‚“ã€‚
          files: |

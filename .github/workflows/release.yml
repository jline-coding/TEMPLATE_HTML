      - name: ðŸ”¨ Build dá»± Ã¡n
        run: ${{ env.BUILD_CMD }}

      - name: ðŸ” Láº¥y báº£n Release trÆ°á»›c Ä‘Ã³ (Náº¿u cÃ³)
        id: prev_release
        run: |
          # DÃ¹ng GitHub CLI Ä‘á»ƒ láº¥y thÃ´ng tin Release má»›i nháº¥t
          PREV_TAG=$(gh release view --json tagName -q ".tagName" 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            echo "ðŸ“Œ ÄÃ£ tÃ¬m tháº¥y báº£n Release trÆ°á»›c Ä‘Ã³: $PREV_TAG"
            
            # TÃ¬m tÃªn file ZIP gá»‘c (loáº¡i trá»« file cÃ³ chá»¯ diff_data)
            FULL_ZIP=$(gh release view "$PREV_TAG" --json assets -q '.assets[].name | select(test("diff_data") | not) | select(endswith(".zip"))' | head -n 1)
            
            if [ -n "$FULL_ZIP" ]; then
              echo "â¬‡ï¸ Táº£i file: $FULL_ZIP"
              gh release download "$PREV_TAG" -p "$FULL_ZIP" --dir prev_release
              
              # Giáº£i nÃ©n vÃ o thÆ° má»¥c public_old
              mkdir -p public_old
              unzip -q "prev_release/$FULL_ZIP" -d public_old
              echo "HAS_PREV_RELEASE=true" >> $GITHUB_ENV
            fi
          else
            echo "â„¹ï¸ ÄÃ¢y lÃ  Release Ä‘áº§u tiÃªn, khÃ´ng cÃ³ báº£n cÅ© Ä‘á»ƒ so sÃ¡nh."
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: âœ‚ï¸ TrÃ­ch xuáº¥t cÃ¡c file thay Ä‘á»•i (Diff)
        if: env.HAS_PREV_RELEASE == 'true'
        run: |
          mkdir -p public_diff
          # So sÃ¡nh ná»™i dung file (-c) giá»¯a báº£n má»›i vÃ  báº£n cÅ©, cá» -m giÃºp loáº¡i bá» thÆ° má»¥c rá»—ng
          rsync -rcvm --compare-dest="$(pwd)/public_old/" "$(pwd)/$SOURCE_FOLDER/" "$(pwd)/public_diff/"
          
          # Dá»n dáº¹p cÃ¡c file rÃ¡c/khÃ´ng cáº§n thiáº¿t khá»i thÆ° má»¥c diff Ä‘á»ƒ Ä‘áº¿m chÃ­nh xÃ¡c
          find public_diff -type f -name '.DS_Store' -delete 2>/dev/null || true
          find public_diff -type f -name '*.map' -delete 2>/dev/null || true
          rm -rf public_diff/.deploy
          
          # XÃ³a toÃ n bá»™ cÃ¡c thÆ° má»¥c rá»—ng (náº¿u cÃ³) do quÃ¡ trÃ¬nh build táº¡o ra
          find public_diff -type d -empty -delete 2>/dev/null || true
          
          # Kiá»ƒm tra xem cÃ³ file nÃ o thá»±c sá»± thay Ä‘á»•i khÃ´ng (bá» qua thÆ° má»¥c rá»—ng)
          CHANGE_COUNT=$(find public_diff -type f | wc -l)
          if [ "$CHANGE_COUNT" -gt "0" ]; then
            DIFF_ZIP_NAME="${PROJECT_DIR}_diff_data_${TAG_NAME}.zip"
            
            # NÃ©n thÆ° má»¥c diff
            cd public_diff
            zip -r "../$DIFF_ZIP_NAME" .
            cd ..
            
            DIFF_ZIP_SIZE=$(du -h "$DIFF_ZIP_NAME" | cut -f1)
            echo "ðŸ“¦ ÄÃ£ táº¡o file Diff: $DIFF_ZIP_NAME ($CHANGE_COUNT file thay Ä‘á»•i, kÃ­ch thÆ°á»›c: $DIFF_ZIP_SIZE)"
          else
            echo "â„¹ï¸ KhÃ´ng cÃ³ sá»± thay Ä‘á»•i nÃ o vá» file tÄ©nh há»£p lá»‡ so vá»›i báº£n trÆ°á»›c."
          fi

      - name: ðŸ“ NÃ©n thÃ nh file ZIP (Báº£n Full)
        run: |
          ZIP_NAME="${PROJECT_DIR}_${TAG_NAME}.zip"
          echo "ZIP_NAME=$ZIP_NAME" >> $GITHUB_ENV

          # NÃ©n thÆ° má»¥c source (public/) thÃ nh ZIP sáº¡ch, giá»¯ láº¡i .htaccess
          cd "$SOURCE_FOLDER"
          zip -r "../$ZIP_NAME" . -x '.deploy/*' '.DS_Store' '*.map'

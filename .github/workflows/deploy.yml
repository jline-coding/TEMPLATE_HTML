name: Deploy To Server

on:
  push:
    branches:
      - master    # Deploy production khi push lÃªn main
      - staging # Deploy lÃªn server test khi push lÃªn staging
  workflow_dispatch: # Cho phÃ©p cháº¡y thá»§ cÃ´ng tá»« GitHub UI

concurrency:
  group: deploy-${{ github.repository }}-${{ github.ref_name }}
  cancel-in-progress: false # Báº¯t buá»™c xáº¿p hÃ ng, khÃ´ng cho 2 ngÆ°á»i cháº¡y cÃ¹ng lÃºc

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: ðŸ“¥ KÃ©o Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1 # Manifest-based: khong can lich su git
          lfs: true

      - name: ðŸ” Äá»c cáº¥u hÃ¬nh Deploy
        id: config
        run: |
          # PhÃ¡t hiá»‡n nhÃ¡nh â†’ xÃ¡c Ä‘á»‹nh mÃ´i trÆ°á»ng
          BRANCH_NAME=${GITHUB_REF#refs/heads/}

          # ðŸ›¡ï¸ Chá»‰ cho phÃ©p deploy tá»« master hoáº·c staging
          if [ "$BRANCH_NAME" != "master" ] && [ "$BRANCH_NAME" != "staging" ]; then
            echo "âŒ Lá»–I: KhÃ´ng Ä‘Æ°á»£c deploy tá»« nhÃ¡nh [$BRANCH_NAME]!"
            echo "   Chá»‰ cho phÃ©p: master (production) hoáº·c staging (test)."
            exit 1
          fi

          if [ "$BRANCH_NAME" = "staging" ]; then
            DEPLOY_ENV="test"
          else
            DEPLOY_ENV="production"
          fi
          echo "DEPLOY_BRANCH=$BRANCH_NAME" >> $GITHUB_ENV
          echo "DEPLOY_ENV=$DEPLOY_ENV" >> $GITHUB_ENV
          echo "ðŸ“Œ NhÃ¡nh: $BRANCH_NAME â†’ MÃ´i trÆ°á»ng: $DEPLOY_ENV"

          # Äá»c cáº¥u hÃ¬nh chung
          BUILD_CMD=$(jq -r '.build_command // "npm run build"' deploy-config.json)

          # Äá»c deploy_method tá»« mÃ´i trÆ°á»ng (máº·c Ä‘á»‹nh: ftp)
          DEPLOY_METHOD=$(jq -r --arg env "$DEPLOY_ENV" '.[$env].deploy_method // "ftp"' deploy-config.json)
          echo "DEPLOY_METHOD=$DEPLOY_METHOD" >> $GITHUB_ENV
          echo "ðŸ“¦ PhÆ°Æ¡ng thá»©c: $DEPLOY_METHOD"

          # Äá»c server tá»« Ä‘Ãºng mÃ´i trÆ°á»ng (chá»‰ cáº§n khi FTP hoáº·c Rsync)
          SERVER_NAME=$(jq -r --arg env "$DEPLOY_ENV" '.[$env].server // ""' deploy-config.json | tr 'a-z' 'A-Z')
          echo "ðŸ–¥ï¸ Server: ${SERVER_NAME:-'(khÃ´ng dÃ¹ng FTP)'}"

          echo "SERVER_NAME=$SERVER_NAME" >> $GITHUB_ENV
          echo "BUILD_CMD=$BUILD_CMD" >> $GITHUB_ENV

          # ðŸ›¡ï¸ Validate BUILD_CMD (chá»‰ cho phÃ©p npm/npx commands)
          if ! echo "$BUILD_CMD" | grep -qE '^(npm |npx )'; then
            echo "âŒ Lá»–I: BUILD_CMD khÃ´ng há»£p lá»‡: '$BUILD_CMD'"
            echo "   Chá»‰ cho phÃ©p cÃ¡c lá»‡nh báº¯t Ä‘áº§u báº±ng 'npm ' hoáº·c 'npx '."
            exit 1
          fi

      # â”€â”€ Cháº¿ Ä‘á»™ ZIP: Bá» qua toÃ n bá»™ (chá»‰ cáº§n táº¡o tag Ä‘á»ƒ release) â”€â”€
      - name: â„¹ï¸ Bá» qua deploy (cháº¿ Ä‘á»™ ZIP)
        if: env.DEPLOY_METHOD == 'zip'
        run: |
          echo "â•”â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•—"
          echo "â•‘  ðŸ“¦ MÃ´i trÆ°á»ng [${{ env.DEPLOY_ENV }}] Ä‘ang á»Ÿ cháº¿ Ä‘á»™ ZIP  â•‘"
          echo "â•‘  â†’ Bá» qua FTP deploy.                           â•‘"
          echo "â•‘  â†’ Táº¡o tag (vd: git tag v1.0.0) Ä‘á»ƒ táº¡o Release. â•‘"
          echo "â•šâ•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•"

      # â”€â”€ Cháº¿ Ä‘á»™ FTP: Build + Deploy lÃªn server â”€â”€
      - name: âš™ï¸ CÃ i Ä‘áº·t Node.js
        if: env.DEPLOY_METHOD == 'ftp' || env.DEPLOY_METHOD == 'ssh'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: ðŸ“¦ CÃ i Ä‘áº·t dependencies dá»± Ã¡n (náº¿u cáº§n build)
        if: (env.DEPLOY_METHOD == 'ftp' || env.DEPLOY_METHOD == 'ssh')
        run: npm install --no-package-lock

      - name: ðŸ§ª Cháº¡y Unit Tests
        if: (env.DEPLOY_METHOD == 'ftp' || env.DEPLOY_METHOD == 'ssh')
        run: npm run test

      - name: ðŸ”¨ Build dá»± Ã¡n
        if: (env.DEPLOY_METHOD == 'ftp' || env.DEPLOY_METHOD == 'ssh')
        run: ${{ env.BUILD_CMD }}

      - name: ðŸ“¦ CÃ i Ä‘áº·t thÆ° viá»‡n deploy
        if: env.DEPLOY_METHOD == 'ftp'
        run: npm install --no-save basic-ftp apache-crypt

      - name: ðŸš€ Cháº¡y Script Deploy (FTP)
        if: env.DEPLOY_METHOD == 'ftp'
        run: node .github/scripts/deploy.cjs
        env:
          GITHUB_REPO: ${{ github.repository }}
          DEPLOY_BRANCH: ${{ env.DEPLOY_BRANCH }}
          DEPLOY_ENV: ${{ env.DEPLOY_ENV }}
          SSH_HOST: ${{ fromJson(secrets[format('{0}_CONFIG', env.SERVER_NAME)] || '{}').host }}
          SSH_USER: ${{ fromJson(secrets[format('{0}_CONFIG', env.SERVER_NAME)] || '{}').user }}
          SSH_PASS: ${{ fromJson(secrets[format('{0}_CONFIG', env.SERVER_NAME)] || '{}').pass }}
          ROOT_PATH: ${{ fromJson(secrets[format('{0}_CONFIG', env.SERVER_NAME)] || '{}').root_path }}
          FTP_DIR: ${{ fromJson(secrets[format('{0}_CONFIG', env.SERVER_NAME)] || '{}').ftp_dir }}
          FTP_GIT: ${{ fromJson(secrets[format('{0}_CONFIG', env.SERVER_NAME)] || '{}').ftp_git }}

      # â”€â”€ Cháº¿ Ä‘á»™ SSH: Triá»ƒn khai qua SSH rsync â”€â”€
      - name: ðŸ”‘ CÃ i Ä‘áº·t SSH Key cho Deploy
        if: env.DEPLOY_METHOD == 'ssh'
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ fromJson(secrets[format('{0}_CONFIG', env.SERVER_NAME)] || '{}').private_key }}

      - name: ðŸš€ Cháº¡y Script Deploy (SSH)
        if: env.DEPLOY_METHOD == 'ssh'
        run: bash .github/scripts/deploy-rsync.sh
        env:
          GITHUB_REPO: ${{ github.repository }}
          DEPLOY_BRANCH: ${{ env.DEPLOY_BRANCH }}
          DEPLOY_ENV: ${{ env.DEPLOY_ENV }}
          SSH_HOST: ${{ fromJson(secrets[format('{0}_CONFIG', env.SERVER_NAME)] || '{}').host }}
          SSH_USER: ${{ fromJson(secrets[format('{0}_CONFIG', env.SERVER_NAME)] || '{}').user }}
          SSH_PORT: ${{ fromJson(secrets[format('{0}_CONFIG', env.SERVER_NAME)] || '{}').ssh_port }}
          ROOT_PATH: ${{ fromJson(secrets[format('{0}_CONFIG', env.SERVER_NAME)] || '{}').root_path }}
          FTP_GIT: ${{ fromJson(secrets[format('{0}_CONFIG', env.SERVER_NAME)] || '{}').ftp_git }}

      - name: ðŸ¥ Health Check (Basic)
        if: (env.DEPLOY_METHOD == 'ftp' || env.DEPLOY_METHOD == 'ssh') && success()
        run: |
          # Try to guess domain from SSH_HOST or FTP HOST
          DOMAIN=$(echo "${{ fromJson(secrets[format('{0}_CONFIG', env.SERVER_NAME)] || '{}').host }}" | sed -e 's/^ftp\.//')
          ROOT_PATH="${{ fromJson(secrets[format('{0}_CONFIG', env.SERVER_NAME)] || '{}').root_path }}"
          WEB_PATH=$(echo "$ROOT_PATH" | sed -E 's|^.*?/public_html/?|/|')
          PROJECT_DIR=$(jq -r --arg env "$DEPLOY_ENV" '.[$env].project_dir // ""' deploy-config.json)
          
          SITE_URL="https://${DOMAIN}/${WEB_PATH}/${PROJECT_DIR}"
          SITE_URL=$(echo "$SITE_URL" | sed 's|//|/|g' | sed 's|https:/|https://|')
          
          echo "ðŸ” Kiá»ƒm tra URL dá»± kiáº¿n: $SITE_URL"
          HTTP_STATUS=$(curl -o /dev/null -s -w "%{http_code}" -I -k "$SITE_URL" || echo "FAILED")
          
          if [ "$HTTP_STATUS" = "200" ] || [ "$HTTP_STATUS" = "301" ] || [ "$HTTP_STATUS" = "302" ] || [ "$HTTP_STATUS" = "401" ]; then
            echo "âœ… Health Check OK: Nháº­n HTTP $HTTP_STATUS"
          else
            echo "âš ï¸ Cáº¢NH BÃO: KhÃ´ng thá»ƒ truy cáº­p URL dá»± kiáº¿n (HTTP $HTTP_STATUS)."
            echo "   CÃ³ thá»ƒ URL chÆ°a Ä‘Æ°á»£c public hoáº·c cáº¥u hÃ¬nh directory khÃ´ng khá»›p domain."
            echo "   Vui lÃ²ng kiá»ƒm tra trang web thá»§ cÃ´ng!"
          fi

      - name: âŒ Lá»—i Deploy
        if: failure()
        run: |
          echo "âŒ QuÃ¡ trÃ¬nh deploy tháº¥t báº¡i!"
          echo "ðŸ‘‰ Kiá»ƒm tra log cÃ¡c bÆ°á»›c trÆ°á»›c Ä‘Ã³ trÃªn GitHub Actions."
          echo "TODO: CÃ³ thá»ƒ tÃ­ch há»£p Slack/Discord webhook táº¡i Ä‘Ã¢y."
          exit 1
